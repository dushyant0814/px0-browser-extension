name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & release px0-extension-host
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.mod

      - name: Test
        working-directory: host
        run: go vet ./... && go test ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Asset names carry no version so releases/latest/download/<name>
          # always resolves; install.sh relies on that.
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${t%/*}
            arch=${t#*/}
            (cd host && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
              -o "../dist/px0-extension-host-$os-$arch" .)
            # install.sh downloads the gzipped copy; it is roughly half the size.
            gzip -9 -k "dist/px0-extension-host-$os-$arch"
          done
          cp install.sh dist/install.sh
          (cd dist && sha256sum px0-extension-host-* install.sh > checksums.txt && cat checksums.txt)
          # The extension itself, stamped with the tag's version, for the Web Store.
          scripts/package.sh "$VERSION"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
